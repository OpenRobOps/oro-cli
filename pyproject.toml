[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oro-cli"
version = "0.1.0"
description = "Command line tool for OpenRobOps (ORO): configuration as code and fleet queries"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "InOrbit, Inc." }]
keywords = ["openrobops", "oro", "cli", "robotics", "configuration"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "click>=8.2",
    "requests>=2.32",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "unidiff>=0.7",
]

[project.optional-dependencies]
dev = ["pytest", "requests-mock", "ruff", "build", "twine"]

[project.scripts]
oro = "oro_cli.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["oro_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sourced ROS installs register launch_testing pytest plugins via PYTHONPATH; they import
# packages not present in this venv, so keep them out.
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]
